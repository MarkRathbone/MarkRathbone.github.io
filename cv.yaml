experience:
  - company: Clearcare Solutions
    role: Lead DevOps Engineer
    location: Stafford, United Kingdom
    start: April 2026
    end: Present
    logo: /company-logos/clearcare.svg
    summary: Owns the technical direction of infrastructure and platform engineering across AWS and Azure, setting the roadmap and building internal capabilities that make delivery safer, more consistent, and easier for teams to own.
    highlights:
      - Sets platform priorities with lead developers, support leadership, and the CFO, aligning delivery, cloud cost, security, and operational investment with wider business needs.
      - Proposed, architected, and built an internal developer platform supporting approximately 10 engineers across 30–40 repositories, including four frequently changing core product codebases.
      - Designed central release orchestration and introduced the organisation's first defined rollback strategy, combining validated manifests, deployment evidence, smoke checks, and controlled recovery paths.
      - Built self-service Go tooling and codified multi-account AWS foundations in Terraform, introducing reusable workflows and guardrails around identity, state, secrets, and immutable deployments.
      - Supports more than 20 colleagues across engineering, QA, customer support, finance, and commercial teams, advising on operations, cloud cost, technical alignment, and security for systems handling sensitive and personal data.
      - Established an internally operated AI-assisted workflow integrated with Jira and pull requests to review changes, comment on developer work, and propose scoped fixes, guided by reusable task-specific instructions, controlled access, and mandatory human approval.
      - Raises engineering capability through automated tests, shared contracts, clear runbooks, code standards, and hands-on mentoring of junior engineers and apprentices.

