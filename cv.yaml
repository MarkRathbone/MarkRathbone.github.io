experience:
  - company: ClearCare Solutions
    role: Lead DevOps Engineer
    location: Stafford, United Kingdom
    start: April 2026
    end: Present
    logo: /company-logos/clearcare.svg
    summary: Sets the direction for infrastructure and platform engineering across AWS and Azure, while building the tools and release workflows that make delivery safer for the teams using them.
    highlights:
      - Sets platform priorities with lead developers and the CFO, balancing delivery risk, cloud cost, security, and operational investment.
      - Proposed and built an internal developer platform around the needs of roughly 10 engineers working across 30–40 repositories, including four core product codebases.
      - Built central release tooling with validated manifests, deployment evidence, smoke checks, and controlled recovery, introducing the organisation's first defined rollback path.
      - Created self-service Go tooling and codified multi-account AWS foundations in Terraform, adding reusable workflows and guardrails for identity, state, secrets, and immutable deployments.
      - Advises QA, support, and commercial teams on deployments, operations, and security questions for systems handling sensitive personal data.
      - Built an internal AI assistant that reads Jira tickets, reviews open pull requests, and opens small fix PRs of its own. Access is controlled, tasks follow shared instructions, and engineers approve every change.
      - Mentors junior engineers and apprentices, while improving the tests, shared contracts, and runbooks used across the team.

  - company: Searidge Technologies
    role: Cloud Operations Engineer
    location: Ottawa, Canada
    start: October 2025
    end: February 2026
    logo: /company-logos/searidge.png
    summary: Improved and stabilised CI/CD and infrastructure workflows within an AWS-based environment, focusing on consistency, automation, and maintainability.
    highlights:
      - Refactored GitLab CI/CD pipelines, defining a clearer architecture for future deployment workflows.
      - Managed and evolved AWS infrastructure using Terraform, improving consistency and reducing configuration drift.
      - Developed automation tooling to convert API definitions into Terraform, reducing manual provisioning effort.
      - Supported Linux-based build agents and infrastructure tooling, resolving issues across scripting, permissions, and system configuration.
    note: Role concluded due to organisational restructuring.

  - company: Vitrifi
    role: Software Engineer
    location: London, United Kingdom
    start: May 2025
    end: August 2025
    logo: /company-logos/vitrifi.jpg
    summary: Brought software engineering practices into telco network environments, improving deployment workflows and system observability.
    highlights:
      - Applied technologies such as NETCONF, gNMI, and YANG to interact with and manage network infrastructure.
      - Improved CI/CD pipelines to standardise deployments into AWS EKS, reducing operational complexity and improving reliability.
      - Designed and implemented monitoring solutions using Prometheus and Grafana, increasing visibility into system performance and incidents.
    note: Role concluded following company closure.

  - company: PM Connect
    role: DevOps Engineer
    location: Birmingham, United Kingdom
    start: November 2022
    end: May 2025
    logo: /company-logos/pm-connect.png
    summary: Built and ran Kubernetes platforms for production services, focusing on repeatable deployments, useful observability, and tools other engineers could work with.
    highlights:
      - Owned the lifecycle of EKS clusters, including CI/CD pipelines, autoscaling (KEDA), ingress (Traefik), and observability using Prometheus, Grafana, and Datadog.
      - Led development of Kubernetes Operators in Go to manage AWS infrastructure, creating a unified control plane and reducing manual provisioning effort.
      - Turned one-off infrastructure and deployment steps into standard workflows that engineers could reuse.
      - Built CI/CD pipelines with security scanning and automated deployments, so releases followed the same checks across environments.
      - Built internal tooling in Go, Python, and Bash to streamline infrastructure provisioning and simplify platform usage for engineers.
      - Used AI as a supervised engineering tool for code exploration, implementation, review, tests, and documentation, with human review and careful handling of proprietary information.

  - company: TransACT Technology Solutions
    role: Cloud Engineer
    location: London, United Kingdom
    start: February 2021
    end: November 2022
    logo: /company-logos/transact.webp
    summary: Designed and delivered AWS-based data pipelines and cloud solutions, supporting FinOps initiatives and improving scalability and reliability of data processing systems.
    highlights:
      - Built and evolved data pipelines for cost and usage reporting, improving performance and reliability of FinOps workflows.
      - Delivered end-to-end cloud solutions from design through to production rollout for internal and customer-facing use cases.
      - Worked across AWS services including Athena, Glue, EMR, Lambda, Redshift, and Step Functions to support data processing workloads.
      - Implemented monitoring and alerting using CloudWatch, improving system visibility and operational stability.
      - Contributed to AWS Service Delivery Program validation by aligning infrastructure and processes with AWS best practices.

  - company: Generation UK & Ireland
    role: AWS re/Start Graduate
    location: Birmingham, United Kingdom
    start: June 2020
    end: September 2020
    logo: /company-logos/generation.svg
    summary: Completed an intensive cloud engineering programme covering AWS, Linux, and Python, building a strong foundation in cloud infrastructure and system operations.
    highlights:
      - Gained hands-on experience with core AWS services including EC2, S3, IAM, VPC, Lambda, RDS, and CloudFormation.
      - Developed foundational skills in Linux, scripting, and cloud architecture.
      - Built communication skills, including explaining technical concepts to non-technical stakeholders.

