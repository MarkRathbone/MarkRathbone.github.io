profile:
  short: I set platform direction and build the tools that help teams ship safely.
  paragraphs:
    - I build the tooling and delivery practices that make it easier for engineers to ship reliable software. Over six years in DevOps and platform engineering, I've gone from AWS data pipelines and Kubernetes operations to setting platform direction across AWS and Azure. I still work hands-on in Go, Python, Terraform, GitHub Actions, and GitLab CI/CD.
    - At ClearCare, I proposed and built an internal developer platform and introduced a defined rollback path through shared release tooling. I work with engineering, QA, support, finance, and commercial teams to solve practical delivery and security problems. I try new ideas, including AI-assisted workflows, with controlled access and human review, then keep only what proves useful.

