    - Lead DevOps and Platform Engineer with over six years' experience building cloud platforms and the tooling, automation, and standards behind reliable delivery. Hands-on with Go, Python, GitHub Actions, GitLab CI/CD, and Infrastructure as Code, alongside technical leadership, mentoring, and developer experience.
