<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071120" />
    <script>
      (() => {
        try {
          const savedMode = localStorage.getItem("theme-mode");
          const legacyPalette = localStorage.getItem("palette");
          const validModes = ["dark", "mid", "light"];
          const mode = validModes.includes(savedMode) ? savedMode : (legacyPalette === "alternate" ? "dark" : "mid");
          document.documentElement.dataset.theme = mode;
          document.documentElement.style.colorScheme = mode === "light" ? "light" : "dark";
          const themeColours = { dark: "#10090b", mid: "#071120", light: "#f6edcf" };
          document.querySelector('meta[name="theme-color"]').content = themeColours[mode];
        } catch (_) {
          document.documentElement.dataset.theme = "mid";
        }
      })();
    </script>
    <meta name="description" content="Mark Rathbone — Lead DevOps and Platform Engineer building delivery platforms, cloud infrastructure, and confident engineering teams." />
    <meta property="og:title" content="Mark Rathbone — Lead DevOps & Platform Engineer" />
    <meta property="og:description" content="Developer platforms, delivery engineering, Kubernetes, infrastructure as code, and responsible AI-assisted engineering." />
    <meta property="og:image" content="/social-image.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Mark Rathbone — Lead DevOps & Platform Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
